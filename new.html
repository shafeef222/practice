<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script practices</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="circle">
    <h1 id="circle">circle</h1>
    <h3>calculate the area and circumferenceof a circle ?</h3>
    <label ><b>radius :</b></label>
    <input type="number" id="radius" ><br><br>
    
    
    <button id="circlebtn">submit!</button><br><br>
    <h4 id="greeting"></h4>
    <h4 id="area"></h4><br>
    </div>

<div class="rectangle">
    <h1 id="rectangle">rectangle</h1>   
    <h3>calculate the area and perimeter of a rectangle ?</h3>
    <label ><b>length:</b></label>
    <input type="number" id="length" ><br><br>
    <label ><b>width :</b></label>
    <input type="number" id="width" ><br><br>
    <button id="recbtn">submit!</button><br><br>
    <h4 id="rectangle-area"></h4>
    <h4 id="rectangle-perimeter"></h4><br>
</div>

<div class="triangle">
    <h1 id="triangle">triangle</h1>
    <h3>calculate the area and perimeter of a triangle ?</h3>
    <label><b>base :</b></label>
    <input type="number" id="base"><br>
    <label><b>side_1:</b></label>
    <input type="number" id="side_1"> <br>
    <label><b>side_2:</b></label>
    <input type="number" id="side_2"> <br>
    <label><b>height :</b></label>
    <input type="number" id="height"> <br><br>
    <button id="trianglebtn">submit!</button><br><br>
    <h4 id="triangle-area"></h4>
    <h4 id="triangle-perimeter"></h4><br>
</div>
</body>
</html>
